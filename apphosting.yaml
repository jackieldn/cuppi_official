# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # Public reCAPTCHA site key (it ships in the client bundle). NEXT_PUBLIC_*
  # values are inlined at build time, so this must be available to BUILD or the
  # beta-signup widget renders with an undefined key. The live site was built
  # with this value before the repository was connected to App Hosting.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdCC2YsAAAAACMizoGSIrJ39pxxA-rxSf4G9npv
    availability:
      - BUILD
      - RUNTIME

  # jackiepoot.co.uk (the portfolio) is only needed while job hunting. Set this
  # to "false" and redeploy to swap the portfolio for a "Back soon" page
  # (/admin stays reachable). Cuppi is unaffected. See src/lib/sites.ts.
  - variable: PORTFOLIO_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # Support form (src/app/actions/send-support-email.ts). Server-side only, so
  # RUNTIME. The secrets live in Secret Manager; create them with
  #   firebase apphosting:secrets:set <NAME> --project studio-5700093446-89b93
  # before merging a change to this file, or the rollout fails.
  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME
  # Where support messages are delivered. Kept out of the public repository.
  - variable: SUPPORT_EMAIL_TO
    secret: SUPPORT_EMAIL_TO
    availability:
      - RUNTIME
  # Must be a sender verified in Brevo. Already public on the site.
  - variable: SUPPORT_EMAIL_FROM
    value: support@cuppi.co.uk
    availability:
      - RUNTIME
